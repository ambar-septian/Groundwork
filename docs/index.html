*Precision@k** — what fraction of retrieved chunks were relevant? Watch it when prompts feel bloated: low precision means you're paying tokens for noise. In practice recall is primary, precision is the tiebreaker."]},{"code":"import json\n\ndef evaluate(dataset_path, search, k=5):\n    \"\"\"dataset: JSONL of {\"question\": str, \"relevant_ids\": [chunk_id, ...]}\n    search: callable(query, k) -> list of chunk ids, best first (lesson 2.2/2.4)\n    \"\"\"\n    rows = [json.loads(line) for line in open(dataset_path)]\n    recall_hits, rr_sum, per_question = 0, 0.0, []\n\n    for row in rows:\n        got = search(row[\"question\"], k)\n        relevant = set(row[\"relevant_ids\"])\n        ranks = [i + 1 for i, cid in enumerate(got) if cid in relevant]\n        hit = bool(ranks)\n        recall_hits += hit\n        rr_sum += 1.0 / ranks[0] if ranks else 0.0\n        per_question.append({\"q\": row[\"question\"], \"hit\": hit,\n                             \"first_rank\": ranks[0] if ranks else None})\n\n    n = len(rows)\n    report = {\"recall@k\": recall_hits / n, \"mrr\": rr_sum / n, \"n\": n}\n    failures = [p for p in per_question if not p[\"hit\"]]\n    return report, failures      # failures are the to-do list, not just a number\n\nreport, failures = evaluate(\"golden.jsonl\", search, k=5)\nprint(report)                    # {\"recall@k\": 0.84, \"mrr\": 0.71, \"n\": 50}\nfor f in failures[:10]:\n    print(\"MISS:\", f[\"q\"])       # read these — patterns will jump out","lang":"python","caption":"A complete retrieval eval harness — under 30 lines"},{"h":"Using it like an engineer"},{"list":["**Baseline first.** Run it on the naive pipeline before changing anything. Every future change gets compared against this number.","**One variable at a time.** Chunk size 500 → 300, embedding model A → B, vector-only → hybrid, +reranker. Each is one run of the harness. Now 'did hybrid search help?' has a numeric answer — for *your* corpus, which is the only corpus that matters.","**Read the failures, not just the score.** Ten misses usually cluster into two or three patterns (identifiers, cross-chunk answers, vocabulary mismatch). The cluster tells you which upgrade from lesson 2.2/2.3 to reach for; the score alone tells you nothing actionable.","**Make it a regression gate.** Run the harness in CI on every pipeline change; fail the build if recall@5 drops more than a point. Prompt and pipeline changes now carry the same safety net as code changes — this exact loop, generalized beyond retrieval, is Phase 4."]},{"note":"Fifty questions feels unscientific — embrace it anyway. A 50-question eval that runs in 10 seconds and catches a 15-point recall regression before deploy is worth more than a perfect benchmark you never run. Start small; grow it from real failures."}],"exercise":{"intro":"Close the loop on your lesson-2.4 system: measure it, improve it, and prove the improvement.","steps":["Build a golden dataset for your corpus: draft 3 questions per chunk with a cheap model for ~20 chunks, hand-review, rewrite a third in user vocabulary, add 5 identifier queries and 5 unanswerables. Target ~50 rows of JSONL.","Run the harness above against your pipeline. Record baseline recall@5 and MRR. Read every failure and write down the failure clusters you see.","Make the single change your failures point at (hybrid search if identifiers failed; breadcrumbs/re-chunking if context-free chunks failed; different embedding model if paraphrases failed). Re-run. Did the number move? Did anything regress?","Wire it into your workflow: a `make eval` target (or GitHub Action) that runs the harness and prints the diff versus the committed baseline. Commit dataset + baseline. You now practice eval-driven development — carry this habit straight into Phase 4."]},"goDeeper":[{"label":"Ragas — RAG evaluation framework (for when you outgrow the harness)","url":"https://docs.ragas.io/"},{"label":"Evaluating retrieval (Weaviate blog on IR metrics)","url":"https://weaviate.io/blog/retrieval-evaluation-metrics"}]}]},{"id":"phase-3","number":3,"title":"Agent Frameworks","tagline":"From single calls to systems that decide, act, and loop — orchestration, tools, patterns, and MCP.","lessons":[{"id":"p3-langchain-langgraph","number":"3.1","title":"Orchestration with LangChain & LangGraph","status":"outline","objectives":["Know what orchestration frameworks actually buy you over the bare SDK calls from Phase 1","Rebuild the Phase 2 RAG pipeline in LangChain and judge the trade-off yourself","Model an agent as a graph in LangGraph: state, nodes, edges, and checkpoints"],"body":[{"p":"Outline — the full lesson will cover:"},{"list":["**What frameworks solve**: provider abstraction, composition of steps, retries, streaming plumbing, tracing hooks — and what they cost: indirection, churny APIs, harder debugging. You've built RAG bare, so you can evaluate this trade honestly.","**LangChain in one sitting**: chat models, prompt templates, output parsers, and LCEL composition. Rebuilding lesson 2.4's pipeline in ~20 lines.","**LangGraph as the serious tool**: agents as state machines — a `State` dict, nodes as functions, conditional edges for loops. Why 'graph with cycles' is the right abstraction for agents when 'chain' stops being enough.","**Persistence & human-in-the-loop**: checkpointers, interrupts, resuming a run — the features that separate demos from products.","**When to skip frameworks entirely**: the (strong) case for plain Python + the SDK for simple pipelines, and the signals that you've grown into needing a graph."]},{"note":"Full lesson coming — this outline is the skeleton it will be built on."}],"goDeeper":[{"label":"LangGraph docs","url":"https://langchain-ai.github.io/langgraph/"}]},{"id":"p3-tool-use","number":"3.2","title":"Tool Use (Function Calling)","status":"outline","objectives":["Define tools with JSON schemas and run the tool-use loop by hand once","Design tool interfaces the model can actually use well (naming, descriptions, error returns)","Handle parallel tool calls, tool errors, and the security posture of executing model-chosen actions"],"body":[{"p":"Outline — the full lesson will cover:"},{"list":["**The mechanism**: you send tool definitions (name, description, JSON Schema input); the model replies with `stop_reason: \"tool_use\"` and structured arguments; your code executes and sends back a `tool_result`; loop until `end_turn`. The model never runs anything — it only asks.","**The bare loop in Python** against the Anthropic Messages API — written once by hand, exactly like the bare RAG pipeline, so SDK tool-runners and framework agents demystify themselves.","**Tool design as API design**: descriptions are prompts; enums beat free strings; return informative errors (`is_error: true`) so the model can self-correct; fewer, sharper tools beat many vague ones.","**Parallel tool calls** and multi-tool results in one turn; timeouts and idempotency for tools with side effects.","**Security**: model-chosen arguments are untrusted input. Validation, allow-lists, human confirmation for destructive actions, and why 'the model as confused deputy' is the threat model."]},{"note":"Full lesson coming — this outline is the skeleton it will be built on."}],"goDeeper":[{"label":"Anthropic docs — tool use","url":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"}]},{"id":"p3-agent-patterns","number":"3.3","title":"Agent Patterns: Single-Agent, Multi-Agent, Planning & Reflection","status":"outline","objectives":["Recognize the standard agent architectures and the problems each actually fits","Understand planning and reflection loops, and their cost/latency/reliability price","Know why 'a single agent with good tools' is the strong default and multi-agent is a scaling decision"],"body":[{"p":"Outline — the full lesson will cover:"},{"list":["**The agent loop** distilled: model → tool calls → observations → model, until done. Everything else is variations.","**Single agent with tools**: the workhorse. Context management across many tool calls (compaction, lesson 1.2 applied), stop conditions, and budget guards (max iterations, max tokens).","**Planning patterns**: plan-then-execute vs interleaved (ReAct-style) reasoning; when an explicit plan artifact helps (long tasks, user visibility) and when it's ceremony.","**Reflection loops**: generate → critique → revise, self-consistency, and verifier models. Where reflection measurably helps (code, math) vs where it just doubles cost.","**Multi-agent**: orchestrator/sub-agent architectures, parallel fan-out for independent subtasks, shared context via files vs message passing — and the honest failure modes: cost multiplication, error compounding, and debugging pain. Anthropic's own guidance: use the simplest pattern that works.","**Durability**: long-running agents need checkpointing, resumability, and human interrupt points — connecting back to LangGraph (3.1) and forward to evaluation (Phase 4)."]},{"note":"Full lesson coming — this outline is the skeleton it will be built on."}],"goDeeper":[{"label":"Anthropic — Building effective agents","url":"https://www.anthropic.com/research/building-effective-agents"}]},{"id":"p3-mcp-server","number":"3.4","title":"Building Your Own MCP Server","status":"outline","objectives":["Formalize what you already know from using MCP: the protocol's actual moving parts","Build and test a working MCP server exposing tools over stdio and HTTP transports","Design MCP tools that compose well with hosts (Claude Desktop/Code, IDEs) you already use"],"body":[{"p":"You've used MCP hands-on already — this lesson turns familiarity into architecture. Outline — the full lesson will cover:"},{"list":["**The model**: hosts, clients, servers; tools, resources, prompts as the three primitives; capability negotiation at initialization. MCP as 'USB-C for tools' — one server, every host.","**MCP vs plain tool use** (3.2): tool use is you wiring functions into *your* app; MCP packages tools behind a protocol so *any* host can discover and call them. When each is the right layer.","**Build one**: a Python (FastMCP) server exposing 2–3 real tools — e.g. querying this course's own SQLite progress database — with typed parameters and docstrings-as-descriptions.","**Transports**: stdio for local (how Claude Desktop launches servers) vs streamable HTTP for remote; where auth lives (OAuth for remote servers) and why local stdio sidesteps it.","**Testing & debugging**: the MCP Inspector, logging, and the classic failure modes (schema mismatches, servers that block the event loop).","**Design taste**: granularity of tools, safe defaults, read-only vs mutating tools, and descriptions written for the model — the same lessons as 3.2, applied at protocol level."]},{"note":"Full lesson coming — this outline is the skeleton it will be built on."}],"goDeeper":[{"label":"Model Context Protocol docs","url":"https://modelcontextprotocol.io/"}]}]},{"id":"phase-4","number":4,"title":"Evaluation & Observability","tagline":"The differentiator phase: proving LLM systems work, catching regressions, and seeing inside them in production.","lessons":[{"id":"p4-golden-datasets","number":"4.1","title":"Golden Datasets","status":"outline","objectives":["Generalize the lesson-2.5 golden dataset from retrieval to any LLM task","Source examples: hand-written, mined from production logs, and synthetic — and balance the three","Design labels and rubrics that make grading tractable"],"body":[{"p":"Outline — the full lesson will cover:"},{"list":["**What 'golden' means per task type**: exact expected output (classification, extraction), reference answers (Q&A), rubrics/criteria (open-ended generation), and expected trajectories (agents: which tools, in what order, with what final state).","**Sourcing**: start with 20 hand-written cases from the spec; grow with mined production failures (every bug becomes a test case — the habit from 2.5); scale with synthetic generation, plus the review discipline that keeps synthetic data honest.","**Coverage thinking**: happy paths, edge cases, adversarial inputs (injection attempts), out-of-scope inputs that should be refused — a test-pyramid mentality transplanted from ordinary software.","**Dataset hygiene**: versioning in git, schema (JSONL conventions), splitting dev vs holdout so you don't overfit prompts to your own eval, and refreshing when the product changes."]},{"note":"Full lesson coming — this outline is the skeleton it will be built on."}]},{"id":"p4-llm-judge","number":"4.2","title":"LLM-as-a-Judge","status":"outline","objectives":["Use a model to grade outputs that have no single correct answer — without fooling yourself","Write judge prompts with rubrics, and validate the judge against human labels","Know the known biases (position, length, self-preference) and the mitigations"],"body":[{"p":"Outline — the full lesson will cover:"},{"list":["**Why**: exact-match metrics can't grade summaries, answers, or agent transcripts; humans don't scale. A judge model scoring against a rubric is the industry-standard middle path.","**Judge prompt anatomy**: the rubric (binary criteria beat 1–10 scales), the evidence (input, output, reference/context), chain-of-thought before verdict, and structured output (lesson 1.6) for the verdict itself.","**Grading modes**: pointwise (score one output) vs pairwise (A vs B — more reliable for comparisons); direct fact-checking against retrieved context for groundedness (closing the loop with RAG).","**Calibrating the judge**: label 30–50 cases yourself, measure judge-human agreement, iterate the rubric until agreement is high enough to trust — the judge is itself an LLM system that needs evaluation.","**Bias catalogue & mitigations**: position bias (swap order and re-judge), length bias, self-preference (judge with a different model family than the one being judged), and cost control via cheap judges for bulk + strong judges for disagreements."]},{"note":"Full lesson coming — this outline is the skeleton it will be built on."}]},{"id":"p4-eval-pipelines","number":"4.3","title":"Eval Pipelines","status":"outline","objectives":["Assemble dataset + task-runner + graders + reporting into a repeatable eval harness","Handle nondeterminism honestly: repeats, pass^k, and reading variance","Choose tooling deliberately: your own ~200-line harness vs promptfoo/Braintrust/LangSmith"],"body":[{"p":"Outline — the full lesson will cover:"},{"list":["**The architecture**: load cases → run the system under test (concurrently — the asyncio payoff from 0.3) → grade (exact/code/judge) → aggregate → report with per-case drill-down. One diagram, then code.","**Nondeterminism**: run each case k times; report pass rate, not a single pass/fail; when flakiness itself is the bug you're measuring.","**Comparing runs**: baseline vs candidate diffing (which cases flipped, not just the aggregate), cost/latency columns next to quality — the numbers a team actually decides with.","**Build vs adopt**: what a minimal self-built harness looks like (you already wrote one in 2.5), and what promptfoo / Braintrust / LangSmith / OpenAI Evals add: UI, history, collaboration, CI integrations."]},{"note":"Full lesson coming — this outline is the skeleton it will be built on."}]},{"id":"p4-regression-testing","number":"4.4","title":"Regression Testing for Prompts & Agents","status":"outline","objectives":["Treat prompts and pipelines as code: every change runs the evals before it ships","Set actionable gates in CI (thresholds, diffs) without flaky-test hell","Extend regression testing to agents: trajectories, tool choices, and end states"],"body":[{"p":"Outline — the full lesson will cover:"},{"list":["**Why prompts regress silently**: a wording tweak fixes one case and breaks five others; a provider model update shifts behavior under your feet. Version-pinned models + eval gates are the seatbelt.","**CI mechanics**: evals on a schedule and on every prompt/pipeline PR; caching and sampling to keep cost/latency sane; failing the build on threshold breaches vs posting diffs for human review.","**Agent-specific assertions**: did it call the right tools with valid arguments, stay under budget, reach the goal state, avoid forbidden actions? Trajectory evals vs outcome evals, and grading multi-step transcripts with a judge (4.2).","**Model-upgrade playbooks**: how to evaluate a new model version against your suite before switching — the exact workflow teams run every time a provider ships a new generation."]},{"note":"Full lesson coming — this outline is the skeleton it will be built on."}]},{"id":"p4-observability","number":"4.5","title":"Tracing & Observability","status":"outline","objectives":["Instrument LLM apps with traces: every step, prompt, tool call, and token count, linked per request","Monitor production: cost, latency, error and refusal rates, and quality drift","Close the flywheel: production traces become eval cases"],"body":[{"p":"Outline — the full lesson will cover:"},{"list":["**Why printf doesn't survive contact with agents**: a single request fans out into retrievals, tool calls, sub-agents. Traces (spans with parent/child structure — OpenTelemetry semantics) are the right shape; you already met the need in lesson 2.4's logging.","**The LLM-native platforms**: LangSmith, Langfuse (open-source), Braintrust, Phoenix — what they add over raw OTel: prompt/response capture, token/cost accounting, eval integration, trace-to-dataset workflows.","**Production dashboards that matter**: cost per request/user/feature, p50/p95 time-to-first-token, error & refusal rates, retrieval hit rates, guardrail trips. Alerting on drift, not just downtime.","**Feedback loops**: user thumbs-down → trace → labeled eval case → regression suite (4.4). The flywheel that makes systems get better instead of just older.","**Privacy & retention**: prompts contain user data; redaction, sampling, and retention policies belong in the design, not the postmortem."]},{"note":"Full lesson coming — this outline is the skeleton it will be built on."}]}]},{"id":"phase-5","number":5,"title":"Portfolio Projects","tagline":"Three build-and-ship projects that map to real job postings — with your native iOS/macOS edge on top.","lessons":[{"id":"p5-rag-system","number":"5.1","title":"Project 1: A Production RAG System with Retrieval Evaluation","status":"outline","objectives":["Ship a deployed RAG product over a non-trivial corpus, not a notebook demo","Demonstrate eval-driven iteration: baseline → measured improvements → report","Produce the artifacts a hiring engineer actually inspects: repo, eval numbers, design writeup"],"body":[{"p":"Outline — the full project spec will cover:"},{"list":["**Scope**: pick a corpus with real texture (e.g. Swift Evolution proposals + release notes — your domain advantage). Ingestion with structure-aware chunking, hybrid retrieval + reranking, grounded generation with citations, streaming API.","**The eval story is the point**: a golden dataset (2.5/4.1), recall@k + MRR baseline, at least two measured improvements with before/after numbers, and answer-quality judging (4.2). The README leads with the numbers table.","**Production trimmings**: tracing (4.5), cost/latency budgets, ingestion refresh, honest failure handling — the refusal path tested, injection attempted and defended.","**Deployment**: the Node/Express + volume skills from this app's own DEPLOY.md, reapplied (or FastAPI — same shapes).","**Differentiator**: a native SwiftUI client consuming your streaming API — citations rendered as tappable sources; nobody else's portfolio has this."]},{"note":"Full project spec coming — this outline is the skeleton it will be built on."}]},{"id":"p5-agent","number":"5.2","title":"Project 2: An LLM Agent with Tool Use & Failure-Mode Evaluation","status":"outline","objectives":["Build an agent that does real multi-step work with 3–5 well-designed tools","Engineer the unglamorous parts: budgets, checkpoints, human confirmation for destructive actions","Evaluate trajectories, not just outcomes — and document the failure modes you found"],"body":[{"p":"Outline — the full project spec will cover:"},{"list":["**Candidate scopes** (pick one with verifiable outcomes): a release-notes agent that reads merged PRs and drafts notes; a triage agent over crash reports; a codebase-Q&A agent with file tools. Verifiability is what makes the eval story possible.","**Architecture**: single agent with tools (3.3's strong default), LangGraph state machine with checkpointing, max-iteration/token budgets, and an interrupt point before any mutating action.","**Tool design** per 3.2: sharp schemas, informative errors, idempotency. One MCP-packaged tool (3.4) to show protocol fluency.","**The failure-mode eval is the headline**: a trajectory eval suite (4.4) — right tools called, budget respected, goal state reached — plus a taxonomy of observed failures (looping, wrong-tool, hallucinated arguments, premature stop) with frequencies and mitigations. This section is what separates you from every 'I built an agent' repo.","**Differentiator**: drive it from a macOS menu-bar app or iOS client with human-approval push notifications for gated actions."]},{"note":"Full project spec coming — this outline is the skeleton it will be built on."}]},{"id":"p5-eval-pipeline","number":"5.3","title":"Project 3: A Reusable LLM Evaluation Pipeline","status":"outline","objectives":["Package the eval skills from Phase 4 into a tool other engineers could adopt","Support the full grading spectrum: exact, code-based, and calibrated LLM-as-judge","Prove it on projects 1 and 2 — dogfooding is the demo"],"body":[{"p":"Outline — the full project spec will cover:"},{"list":["**Shape**: a CLI + library (Python) — `eval run suite.yaml` — with JSONL datasets, pluggable task runners, graders (exact / code / judge with rubric), k-repeats for nondeterminism, and a diff command comparing two runs case-by-case.","**Judge calibration built in** (4.2): a `calibrate` subcommand measuring judge-human agreement on a labeled sample, because an uncalibrated judge is a random number generator with confidence.","**CI story** (4.4): GitHub Action, threshold gates, markdown report on the PR. Cost controls: concurrency limits, caching, sampling.","**Dogfood**: wire it into Project 1 (retrieval + answer quality) and Project 2 (trajectories). The README shows real regressions it caught.","**Why this project matters most**: it demonstrates the Phase-4 differentiator directly — you don't just build LLM systems, you can prove they work. That sentence is the interview."]},{"note":"Full project spec coming — this outline is the skeleton it will be built on."}]}]}]};
(function () {
  var KEY = "groundwork-progress";
  function readRows() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; }
  }
  var realFetch = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    if (url === "/api/lessons") {
      return Promise.resolve({ ok: true, json: function () { return Promise.resolve(window.__GW_DATA__); } });
    }
    if (url === "/api/progress" && (!opts || !opts.method || opts.method === "GET")) {
      return Promise.resolve({ ok: true, json: function () { return Promise.resolve(readRows()); } });
    }
    if (url === "/api/progress" && opts && opts.method === "POST") {
      var body = JSON.parse(opts.body);
      var rows = readRows().filter(function (r) { return r.lessonId !== body.lessonId; });
      rows.push({ lessonId: body.lessonId, complete: body.complete, updatedAt: new Date().toISOString() });
      localStorage.setItem(KEY, JSON.stringify(rows));
      return Promise.resolve({ ok: true, json: function () { return Promise.resolve(body); } });
    }
    return realFetch(url, opts);
  };
})();

<script>
/* Groundwork frontend — plain JS, no build step.
 *
 * Loads the curriculum + progress, renders the chapter-spine TOC and the
 * reading pane, and keeps the URL hash (#/lesson/<id>) as the source of
 * truth for which lesson is open, so lessons are deep-linkable.
 */

(function () {
  "use strict";

  const state = {
    curriculum: null,
    progress: new Map(), // lessonId -> boolean
    progressAvailable: true,
    lessons: [], // flattened, in order
  };

  const $ = (sel) => document.querySelector(sel);

  // ── tiny rendering helpers ─────────────────────────────────────────

  function escapeHtml(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  // Inline formatting for prose strings: `code` and **bold**.
  function inline(s) {
    return escapeHtml(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }

  // ── data loading ───────────────────────────────────────────────────

  async function load() {
    // Lessons are essential; progress degrades gracefully.
    let lessonsError = null;
    try {
      const res = await fetch("/api/lessons");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      state.curriculum = await res.json();
    } catch (err) {
      lessonsError = err;
    }

    try {
      const res = await fetch("/api/progress");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = await res.json();
      for (const row of rows) state.progress.set(row.lessonId, row.complete);
    } catch (err) {
      state.progressAvailable = false;
    }

    if (lessonsError) {
      $("#content").innerHTML =
        '<div class="error-banner">Could not load the curriculum (' +
        escapeHtml(lessonsError.message) +
        "). Check that the server is running, then reload.</div>";
      return;
    }

    state.lessons = state.curriculum.phases.flatMap((phase) =>
      phase.lessons.map((lesson) => ({ ...lesson, phase }))
    );

    renderToc();
    renderOverallProgress();
    route();
  }

  // ── progress ───────────────────────────────────────────────────────

  function isComplete(id) {
    return state.progress.get(id) === true;
  }

  async function setComplete(id, complete) {
    state.progress.set(id, complete); // optimistic
    renderToc();
    renderOverallProgress();
    try {
      const res = await fetch("/api/progress", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lessonId: id, complete }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
    } catch (err) {
      state.progress.set(id, !complete); // roll back
      renderToc();
      renderOverallProgress();
      alert("Couldn't save progress — is the server reachable?");
    }
    renderLesson(currentLessonId());
  }

  function renderOverallProgress() {
    const total = state.lessons.length;
    const done = state.lessons.filter((l) => isComplete(l.id)).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    $("#overall-progress-fill").style.width = pct + "%";
    $("#overall-progress-label").textContent = state.progressAvailable
      ? `${done} of ${total} · ${pct}%`
      : "progress unavailable";
  }

  // ── table of contents ──────────────────────────────────────────────

  function renderToc() {
    const active = currentLessonId();
    const html = state.curriculum.phases
      .map((phase) => {
        const done = phase.lessons.filter((l) => isComplete(l.id)).length;
        const pct = phase.lessons.length
          ? Math.round((done / phase.lessons.length) * 100)
          : 0;
        const items = phase.lessons
          .map((lesson) => {
            const complete = isComplete(lesson.id);
            return `
              <li class="toc-lesson">
                <a href="#/lesson/${lesson.id}"
                   class="${lesson.id === active ? "active" : ""}"
                   aria-current="${lesson.id === active ? "page" : "false"}">
                  <span class="toc-check ${complete ? "" : "todo"}" aria-hidden="true">${complete ? "●" : "○"}</span>
                  <span class="toc-num">${escapeHtml(lesson.number)}</span>
                  <span>${escapeHtml(lesson.title)}</span>
                </a>
              </li>`;
          })
          .join("");
        return `
          <section class="toc-phase">
            <div class="toc-phase-head">
              <div class="toc-phase-num" aria-hidden="true">${phase.number}</div>
              <div class="toc-phase-title">
                <h2>${escapeHtml(phase.title)}</h2>
                <div class="toc-phase-meta">
                  <span class="phase-progress-track" aria-hidden="true">
                    <span class="phase-progress-fill" style="display:block;width:${pct}%"></span>
                  </span>
                  <span>${done}/${phase.lessons.length}</span>
                  ${phase.lightweight ? '<span class="phase-tag">light</span>' : ""}
                </div>
              </div>
            </div>
            <ul class="toc-lessons">${items}</ul>
          </section>`;
      })
      .join("");
    $("#toc").innerHTML = html;
  }

  // ── lesson rendering ───────────────────────────────────────────────

  function renderBlock(block) {
    if (block.h) return `<h2>${inline(block.h)}</h2>`;
    if (block.p) return `<p>${inline(block.p)}</p>`;
    if (block.list) {
      const items = block.list.map((li) => `<li>${inline(li)}</li>`).join("");
      return `<ul>${items}</ul>`;
    }
    if (block.code) {
      const caption = block.caption
        ? `<div class="code-caption">${inline(block.caption)}</div>`
        : "";
      return `
        <figure class="code-block">
          <pre><code class="lang-${escapeHtml(block.lang || "text")}">${escapeHtml(block.code)}</code></pre>
          ${caption}
        </figure>`;
    }
    if (block.note) return `<aside class="note">${inline(block.note)}</aside>`;
    return "";
  }

  function renderLesson(id) {
    const idx = state.lessons.findIndex((l) => l.id === id);
    if (idx === -1) {
      // default to first incomplete lesson, else first lesson
      const next = state.lessons.find((l) => !isComplete(l.id)) || state.lessons[0];
      location.replace("#/lesson/" + next.id);
      return;
    }
    const lesson = state.lessons[idx];
    const phase = lesson.phase;
    const complete = isComplete(lesson.id);
    const prev = state.lessons[idx - 1];
    const next = state.lessons[idx + 1];

    const objectives = lesson.objectives
      ? `<section class="objectives" aria-label="Learning objectives">
           <h2>You'll learn</h2>
           <ul>${lesson.objectives.map((o) => `<li>${inline(o)}</li>`).join("")}</ul>
         </section>`
      : "";

    const outlineBanner =
      lesson.status === "outline"
        ? `<div class="outline-banner"><strong>Outline for now.</strong>
             This lesson is a structured summary — the full write-up lands in a later pass,
             in the same format as Phases 1 &amp; 2.</div>`
        : "";

    const body = (lesson.body || []).map(renderBlock).join("");

    const exercise = lesson.exercise
      ? `<section class="exercise" aria-label="Exercise">
           <h2>Exercise</h2>
           ${lesson.exercise.intro ? `<p class="exercise-intro">${inline(lesson.exercise.intro)}</p>` : ""}
           <ol>${(lesson.exercise.steps || []).map((s) => `<li>${inline(s)}</li>`).join("")}</ol>
         </section>`
      : "";

    const goDeeper =
      lesson.goDeeper && lesson.goDeeper.length
        ? `<section class="go-deeper">
             <h2>Go deeper <span class="optional-tag">(optional)</span></h2>
             <ul>${lesson.goDeeper
               .map(
                 (r) =>
                   `<li><a href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.label)}</a></li>`
               )
               .join("")}</ul>
           </section>`
        : "";

    const pagerLink = (l, dir) =>
      l
        ? `<a class="pager-${dir}" href="#/lesson/${l.id}">
             <span class="pager-dir">${dir === "prev" ? "← Previous" : "Next →"}</span>
             <span class="pager-title">${escapeHtml(l.number)} · ${escapeHtml(l.title)}</span>
           </a>`
        : "<span></span>";

    $("#content").innerHTML = `
      <article>
        <p class="eyebrow">Phase ${phase.number} · ${escapeHtml(phase.title)} — Lesson ${escapeHtml(lesson.number)}</p>
        <h1 class="lesson-title">${escapeHtml(lesson.title)}</h1>
        ${outlineBanner}
        ${objectives}
        <div class="lesson-body">${body}</div>
        ${exercise}
        ${goDeeper}
        <footer class="lesson-footer">
          <button class="complete-toggle ${complete ? "done" : ""}"
                  id="complete-toggle"
                  ${state.progressAvailable ? "" : "disabled"}
                  aria-pressed="${complete}">
            <span class="dot" aria-hidden="true"></span>
            ${complete ? "Completed — tap to unmark" : "Mark complete"}
          </button>
          <nav class="pager" aria-label="Lesson navigation">
            ${pagerLink(prev, "prev")}
            ${pagerLink(next, "next")}
          </nav>
        </footer>
      </article>`;

    const toggle = $("#complete-toggle");
    if (toggle && state.progressAvailable) {
      toggle.addEventListener("click", () => setComplete(lesson.id, !complete));
    }

    document.title = `${lesson.number} ${lesson.title} — Groundwork`;
    renderToc(); // refresh active highlight
  }

  // ── routing ────────────────────────────────────────────────────────

  function currentLessonId() {
    const m = location.hash.match(/^#\/lesson\/(.+)$/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function route() {
    const id = currentLessonId();
    renderLesson(id || "");
    closeSidebar();
    $("#lesson-pane").scrollTo?.(0, 0);
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", route);

  // ── mobile drawer ──────────────────────────────────────────────────

  const sidebar = $("#sidebar");
  const overlay = $("#sidebar-overlay");
  const menuToggle = $("#menu-toggle");

  function openSidebar() {
    sidebar.classList.add("open");
    overlay.hidden = false;
    requestAnimationFrame(() => overlay.classList.add("visible"));
    menuToggle.setAttribute("aria-expanded", "true");
  }
  function closeSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("visible");
    overlay.hidden = true;
    menuToggle.setAttribute("aria-expanded", "false");
  }
  menuToggle.addEventListener("click", () => {
    if (sidebar.classList.contains("open")) closeSidebar();
    else openSidebar();
  });
  overlay.addEventListener("click", closeSidebar);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSidebar();
  });

  load();
})();

</script>
</body>
</html>
